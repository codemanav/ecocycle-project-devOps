target: ecocycle
services:
  marketplace-service: {health: "http://localhost:8081/actuator/health", depends_on: [marketplace-db]}
  transactions-service: {health: "http://localhost:8082/actuator/health", depends_on: [transactions-db, marketplace-service, users-service]}
  users-service: {health: "http://localhost:8083/actuator/health", depends_on: [users-db]}
containers: [marketplace-service, transactions-service, users-service, marketplace-db, transactions-db, users-db, ecocycle-frontend]
smoke:
  - {method: POST, url: "http://localhost:8082/transactions/offer", json: {listingId: 1, offerAmount: 10}}
  - {method: GET, url: "http://localhost:8083/users"}
  - {method: GET, url: "http://localhost:8081/listings"}
max_memory_mb: 1024
