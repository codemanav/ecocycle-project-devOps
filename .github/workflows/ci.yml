name: CI Pipeline

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["release/*"]

jobs:
  build-test-scan:
    name: Build, Test, Analyze, and Push Docker Images
    runs-on: self-hosted

    env:
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      REGISTRY: ghcr.io
      IMAGE_PREFIX: ghcr.io/${{ secrets.GHCR_USERNAME }}/ecocycle

    steps:
      # ---------- Checkout Code ----------
      - name: Checkout source code
        uses: actions/checkout@v3

      # ---------- Setup JDK 17 ----------
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: temurin

      # ---------- Cache Maven Dependencies ----------
      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      # ---------- Build & Test ----------
      - name: Verify and Test (All Services)
        run: |
          export JAVA_HOME=$HOME/.jdk17
          export PATH=$JAVA_HOME/bin:$PATH
          export M2_HOME=$HOME/.maven
          export PATH=$M2_HOME/bin:$PATH

          echo "JAVA_HOME = $JAVA_HOME"
          java -version
          mvn -version

          for service in marketplace-service transaction-service user-service; do
            echo "===== Building and Testing $service ====="
            cd $service
            mvn -B clean verify || exit 1
            cd ..
          done

      # ---------- Static Code Analysis ----------
      - name: Static Analysis (PMD & SpotBugs)
        run: |
          for service in marketplace-service transaction-service user-service; do
            cd $service
            mvn -B pmd:check spotbugs:check || echo "⚠️ Non-blocking issues in $service"
            cd ..
          done

      # ---------- Docker Build ----------
      - name: Build Docker Images
        run: |
          for service in marketplace-service transaction-service user-service; do
            echo "Building image for $service"
            docker build -t $REGISTRY/${{ secrets.GHCR_USERNAME }}/$service:latest $service
          done

      # ---------- Container Scan (Trivy) ----------
      - name: Security Scan (Trivy)
        uses: aquasecurity/trivy-action@0.12.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ secrets.GHCR_USERNAME }}/marketplace-service:latest
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # ---------- GHCR Login ----------
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      # ---------- Push Images ----------
      - name: Push Docker Images to GHCR
        run: |
          for service in marketplace-service transaction-service user-service; do
            docker push $REGISTRY/${{ secrets.GHCR_USERNAME }}/$service:latest
          done
