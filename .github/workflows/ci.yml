          docker push docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest

  staging-deploy:
    needs: build-images
    runs-on: self-hosted
    if: github.event_name == 'pull_request'
    steps:
      - name: Prepare Docker Compose file
        uses: actions/checkout@v4
      - name: SSH Deploy (Pull & Run)
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            echo 'Starting staging deployment'
            export SHA=${{ github.sha }}
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
            cat > docker-compose.auto.yml <<'EOF'
            services:
              marketplace:
                image: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/marketplace-service:${{ github.sha }}
                ports:
                  - '8081:8081'
              transactions:
                image: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/transactions-service:${{ github.sha }}
                ports:
                  - '8082:8082'
              users:
                image: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/users-service:${{ github.sha }}
                ports:
                  - '8083:8083'
            EOF
            docker compose -f docker-compose.auto.yml up -d
            sleep 10
            curl -f http://localhost:8081/actuator/health || exit 1
            curl -f http://localhost:8082/actuator/health || exit 1
            curl -f http://localhost:8083/actuator/health || exit 1
            echo 'Staging health checks passed'

  production-deploy:
    needs: staging-deploy
    runs-on: self-hosted
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/main')
    steps:
      - name: SSH Deploy to Production
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            echo 'Starting production deployment'
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
            # (Assumes same docker-compose.auto.yml strategy or a pre-existing compose file)
            docker pull docker.io/${{ secrets.DOCKERHUB_USERNAME }}/marketplace-service:${{ github.sha }}
            docker pull docker.io/${{ secrets.DOCKERHUB_USERNAME }}/transactions-service:${{ github.sha }}
            docker pull docker.io/${{ secrets.DOCKERHUB_USERNAME }}/users-service:${{ github.sha }}
            # Replace running containers
            docker stop marketplace || true && docker rm marketplace || true
            docker stop transactions || true && docker rm transactions || true
            docker stop users || true && docker rm users || true
            docker run -d --name marketplace -p 8081:8081 docker.io/${{ secrets.DOCKERHUB_USERNAME }}/marketplace-service:${{ github.sha }}
            docker run -d --name transactions -p 8082:8082 docker.io/${{ secrets.DOCKERHUB_USERNAME }}/transactions-service:${{ github.sha }}
            docker run -d --name users -p 8083:8083 docker.io/${{ secrets.DOCKERHUB_USERNAME }}/users-service:${{ github.sha }}
            sleep 10
            curl -f http://localhost:8081/actuator/health || exit 1
            curl -f http://localhost:8082/actuator/health || exit 1
            curl -f http://localhost:8083/actuator/health || exit 1
            echo 'Production deployment successful'
