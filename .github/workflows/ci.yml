name: ecocycle-ci

on:
  pull_request:
    branches:
      - 'main'
      - 'release/**'
  push:
    branches:
      - '**'
      - 'main'
      
jobs:
  build-test:
    runs-on: self-hosted
    strategy:
      matrix:
        service: [marketplace-service, transactions-service, users-service]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Build & Test (${ { matrix.service } })
        working-directory: ${{ matrix.service }}
        run: mvn -q -DskipTests=false test
      - name: Verify (SpotBugs/Checkstyle if configured)
        working-directory: ${{ matrix.service }}
        run: mvn -q -DskipTests=true verify

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical

  build-images:
      vuln-scan:
        needs: build-test
        runs-on: self-hosted
        strategy:
          matrix:
            service: [marketplace-service, transactions-service, users-service]
        steps:
          - name: Checkout
            uses: actions/checkout@v4
          - name: Set up JDK 17
            uses: actions/setup-java@v4
            with:
              distribution: 'temurin'
              java-version: '17'
              cache: 'maven'
          - name: OWASP Dependency Check
            uses: dependency-check/Dependency-Check_Action@v4.2.1
            with:
              project: ${{ matrix.service }}
              path: ${{ matrix.service }}
              format: 'HTML'
              out: 'reports/${{ matrix.service }}'
          - name: Upload Report
            uses: actions/upload-artifact@v4
            with:
              name: depcheck-${{ matrix.service }}
              path: reports/${{ matrix.service }}

    needs: [build-test, dependency-review]
    runs-on: self-hosted
    strategy:
      matrix:
        service: [marketplace-service, transactions-service, users-service]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU (for multi-arch optional)
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}
      - name: Build & Push Image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ github.sha }}
          build-args: |
            MAVEN_OPTS=-Xmx512m

  staging-deploy:
    needs: build-images
    runs-on: self-hosted
    if: github.event_name == 'pull_request'
    steps:
      - name: Prepare Docker Compose file
        uses: actions/checkout@v4
      - name: SSH Deploy (Pull & Run)
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            echo 'Starting staging deployment'
            export SHA=${{ github.sha }}
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.CR_PAT }}
            cat > docker-compose.auto.yml <<'EOF'
            services:
              marketplace:
                image: ghcr.io/${{ github.repository_owner }}/marketplace-service:${{ github.sha }}
                ports:
                  - '8081:8081'
              transactions:
                image: ghcr.io/${{ github.repository_owner }}/transactions-service:${{ github.sha }}
                ports:
                  - '8082:8082'
              users:
                image: ghcr.io/${{ github.repository_owner }}/users-service:${{ github.sha }}
                ports:
                  - '8083:8083'
            EOF
            docker compose -f docker-compose.auto.yml up -d
            sleep 10
            curl -f http://localhost:8081/actuator/health || exit 1
            curl -f http://localhost:8082/actuator/health || exit 1
            curl -f http://localhost:8083/actuator/health || exit 1
            echo 'Staging health checks passed'

  production-deploy:
    needs: staging-deploy
    runs-on: self-hosted
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/main')
    steps:
      - name: SSH Deploy to Production
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.PROD_HOST }}
            username: ${{ secrets.PROD_USER }}
            key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            echo 'Starting production deployment'
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.CR_PAT }}
            # (Assumes same docker-compose.auto.yml strategy or a pre-existing compose file)
            docker pull ghcr.io/${{ github.repository_owner }}/marketplace-service:${{ github.sha }}
            docker pull ghcr.io/${{ github.repository_owner }}/transactions-service:${{ github.sha }}
            docker pull ghcr.io/${{ github.repository_owner }}/users-service:${{ github.sha }}
            # Replace running containers
            docker stop marketplace || true && docker rm marketplace || true
            docker stop transactions || true && docker rm transactions || true
            docker stop users || true && docker rm users || true
            docker run -d --name marketplace -p 8081:8081 ghcr.io/${{ github.repository_owner }}/marketplace-service:${{ github.sha }}
            docker run -d --name transactions -p 8082:8082 ghcr.io/${{ github.repository_owner }}/transactions-service:${{ github.sha }}
            docker run -d --name users -p 8083:8083 ghcr.io/${{ github.repository_owner }}/users-service:${{ github.sha }}
            sleep 10
            curl -f http://localhost:8081/actuator/health || exit 1
            curl -f http://localhost:8082/actuator/health || exit 1
            curl -f http://localhost:8083/actuator/health || exit 1
            echo 'Production deployment successful'
