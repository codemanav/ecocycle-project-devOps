name: CI Pipeline

on:
  pull_request:
    branches: [ develop, "release/*" ]
  push:
    branches: [ develop, "release/*" ]

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest

    env:
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Lint (Spotless + Checkstyle)
        run: |
          mvn spotless:check checkstyle:check -f marketplace-service/pom.xml
          mvn spotless:check checkstyle:check -f transaction-service/pom.xml
          mvn spotless:check checkstyle:check -f user-service/pom.xml

      - name: Run Tests
        run: |
          mvn test -f marketplace-service/pom.xml
          mvn test -f transaction-service/pom.xml
          mvn test -f user-service/pom.xml

      - name: Static Analysis (SpotBugs)
        run: |
          mvn spotbugs:check -f marketplace-service/pom.xml
          mvn spotbugs:check -f transaction-service/pom.xml
          mvn spotbugs:check -f user-service/pom.xml

      - name: Security Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Build & Push Images to GHCR
        run: |
          echo $GHCR_TOKEN | docker login ghcr.io -u $GHCR_USERNAME --password-stdin
          for service in marketplace-service transaction-service user-service; do
            docker build -t ghcr.io/${GHCR_USERNAME}/${service}:latest $service
            docker push ghcr.io/${GHCR_USERNAME}/${service}:latest
          done
