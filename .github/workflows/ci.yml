name: CI Pipeline

on:
  pull_request:
    branches: [ develop, release/* ]
  push:
    branches: [ develop, feature/* ]

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ marketplace-service, transaction-service, user-service ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Lint with Spotless & Checkstyle
        run: |
          cd ${{ matrix.service }}
          mvn spotless:check checkstyle:check

      - name: Run Unit & Integration Tests
        run: |
          cd ${{ matrix.service }}
          mvn clean verify -B

      - name: Static Analysis (SpotBugs + PMD)
        run: |
          cd ${{ matrix.service }}
          mvn spotbugs:check pmd:check

      - name: Security Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          path: ./${{ matrix.service }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  docker-build-push:
    needs: build-test-analyze
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ marketplace-service, transaction-service, user-service ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build Docker image
        run: |
          cd ${{ matrix.service }}
          docker build -t ghcr.io/${{ secrets.GHCR_USERNAME }}/${{ matrix.service }}:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ secrets.GHCR_USERNAME }}/${{ matrix.service }}:${{ github.sha }}
