name: CI Pipeline

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["release/*"]

jobs:
  build-test-scan:
    name: Build, Test, Analyze, and Push Docker Images
    runs-on: self-hosted

    env:
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      REGISTRY: ghcr.io
      IMAGE_PREFIX: ghcr.io/${{ secrets.GHCR_USERNAME }}/ecocycle

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Verify and Test (All Services)
        run: |
          for service in marketplace-service transaction-service user-service; do
            echo "===== Testing $service ====="
            cd $service
            mvn -B spotless:check verify
            cd ..
          done

      - name: Static Analysis (PMD & SpotBugs)
        run: |
          for service in marketplace-service transaction-service user-service; do
            cd $service
            mvn -B pmd:check spotbugs:check || echo "⚠️ Non-blocking static analysis issues in $service"
            cd ..
          done

      - name: Build Docker Images
        run: |
          for service in marketplace-service transaction-service user-service; do
            docker build -t $REGISTRY/${{ secrets.GHCR_USERNAME }}/$service:latest $service
          done

      - name: Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          hide-progress: true
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          image-ref: ${{ env.REGISTRY }}/${{ secrets.GHCR_USERNAME }}/marketplace-service:latest

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Push Images to GHCR
        run: |
          for service in marketplace-service transaction-service user-service; do
            docker push $REGISTRY/${{ secrets.GHCR_USERNAME }}/$service:latest
          done
