name: ecocycle-ci

on:
  pull_request:
    branches:
      - 'main'
      - 'release/**'
  push:
    branches:
      - '**'
      - 'main'
      
jobs:
  build-test:
    runs-on: self-hosted
    strategy:
      matrix:
        service: [marketplace-service, transactions-service, users-service]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Build & Test (${{ matrix.service }})
        working-directory: ${{ matrix.service }}
        run: mvn -q -DskipTests=false test
      - name: Verify (SpotBugs/Checkstyle if configured)
        working-directory: ${{ matrix.service }}
        run: mvn -q -DskipTests=true verify

