spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/transactions}
    username: ${SPRING_DATASOURCE_USERNAME:ecocycle}
    password: ${SPRING_DATASOURCE_PASSWORD:ecocycle}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8082

marketplace:
  base-url: ${MARKETPLACE_BASE_URL:http://localhost:8081}

users:
  base-url: ${USERS_BASE_URL:http://localhost:8083}

jwt:
  secret: ${JWT_SECRET:my-super-long-secret-key-ecocycle-123456789}
  expiration: ${JWT_EXPIRATION_MS:86400000}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:transactions;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true